
<!DOCTYPE html>
<html lang="kn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Harry ಕನ್ನಡ AI</title>
  <style>
    body {
      background: #101827;
      color: white;
      font-family: sans-serif;
      text-align: center;
      padding: 30px 15px;
    }
    button {
      background: #2878ff;
      color: white;
      border: none;
      border-radius: 12px;
      padding: 15px 22px;
      font-size: 18px;
      margin: 8px;
    }
    #answer { color: #8ee8ff; }
  </style>
</head>
<body>
  <h1>Harry</h1>
  <p>ನಿನ್ನ ಕನ್ನಡ AI ಸಹಾಯಕ</p>

  <button onclick="startListening()">Harry ಜೊತೆ ಮಾತನಾಡು</button>
  <button onclick="stopListening()">ನಿಲ್ಲಿಸು</button>

  <p id="status">ಪ್ರಾರಂಭಿಸಲು ಬಟನ್ ಒತ್ತು.</p>
  <p id="answer"></p>

<script>
let recognition;

function speak(text) {
  const voice = new SpeechSynthesisUtterance(text);
  voice.lang = "kn-IN";
  speechSynthesis.speak(voice);
}

function startListening() {
  const SpeechAPI =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechAPI) {
    document.getElementById("status").textContent =
      "ಈ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಧ್ವನಿ ಗುರುತಿಸುವಿಕೆ ಲಭ್ಯವಿಲ್ಲ.";
    return;
  }

  recognition = new SpeechAPI();
  recognition.lang = "kn-IN";
  recognition.continuous = false;

  recognition.onstart = () => {
    document.getElementById("status").textContent =
      "Harry ಕೇಳುತ್ತಿದೆ...";
  };

  recognition.onresult = (event) => {
    const text = event.results[0][0].transcript;
    document.getElementById("answer").textContent =
      "ನೀನು ಹೇಳಿದ್ದು: " + text;

    let reply = "ನಮಸ್ಕಾರ! ನಾನು Harry. ನಿನ್ನ ಮಾತು ಕೇಳಿದೆ.";

    if (text.includes("ನಮಸ್ಕಾರ")) {
      reply = "ನಮಸ್ಕಾರ! ಹೇಗಿದ್ದೀಯ?";
    } else if (text.includes("ಹೆಸರು")) {
      reply = "ನನ್ನ ಹೆಸರು Harry.";
    } else if (text.includes("ಧನ್ಯವಾದ")) {
      reply = "ಸ್ವಾಗತ! ನಿನಗೆ ಸಹಾಯ ಮಾಡಲು ಸಂತೋಷ.";
    }

    document.getElementById("status").textContent =
      "Harry ಉತ್ತರಿಸುತ್ತಿದೆ...";
    speak(reply);
  };

    recognition.onerror = (event) => {
  document.getElementById("status").textContent =
    "ದೋಷ: " + event.error;
};

  recognition.start();
}

function stopListening() {
  if (recognition) recognition.stop();
  speechSynthesis.cancel();
  document.getElementById("status").textContent =
    "Harry ನಿಲ್ಲಿಸಲಾಗಿದೆ.";
}
</script>
</body>
</html>
